server {
 listen 8080;
 location = /health { access_log off; return 200 'ok'; }
 location / { return 308 https://localhost:5181$uri; }
}
server {
 listen 8443 ssl;
 ssl_certificate /etc/nginx/tls/cert.pem;
 ssl_certificate_key /etc/nginx/tls/key.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 server_tokens off;
 add_header Cache-Control no-store always;
 root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
 location /api/ { proxy_pass http://api-gateway:3000; proxy_set_header Host $http_host; proxy_read_timeout 35s; }
 location / { try_files $uri /index.html; }
}
