server {
 listen 8080;
 root /usr/share/nginx/html;
 server_tokens off;
 add_header Cache-Control no-store always;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
 location = /health { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
 location /api/ { proxy_pass http://api-gateway:3000; proxy_set_header Host $http_host; proxy_set_header X-Request-Id $request_id; proxy_read_timeout 35s; }
 location / { try_files $uri /index.html; }
}
